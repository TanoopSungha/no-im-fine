name: Build apps (macOS, Windows, Linux, Android, iOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, cmd: 'npm run dist:mac' }
          - { name: Windows, os: windows-latest, cmd: 'npm run dist:win' }
          - { name: Linux, os: ubuntu-latest, cmd: 'npm run dist:linux' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.cmd }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Smoke test, the packaged app starts and stays up (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          BIN=$(find dist/linux-unpacked -maxdepth 1 -type f -executable ! -name '*.so*' ! -name chrome-sandbox ! -name chrome_crashpad_handler | head -1)
          echo "launching $BIN"
          set +e; xvfb-run -a timeout 20 "$BIN" --no-sandbox; code=$?; set -e
          if [ $code -ne 124 ]; then echo "app exited early with $code"; exit 1; fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Web build + sync into the Android project
        run: npm run mobile:web && npx cap sync android
      - name: Build debug APK (installable by sideloading or MDM)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ github.event.repository.name }}-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator app + unsigned device build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Web build + sync into the iOS project
        run: npm run mobile:web && npx cap sync ios
      - name: Build for the iOS Simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-sim CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Build for devices (unsigned; sign it in Xcode or a sideloading tool to install)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -20
          mkdir -p out/Payload && cp -R build/ios-dev/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry ../${{ github.event.repository.name }}-ios-unsigned.ipa Payload)
          (cd build/ios-sim/Build/Products/Debug-iphonesimulator && zip -qry $GITHUB_WORKSPACE/${{ github.event.repository.name }}-ios-simulator.zip App.app)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ github.event.repository.name }}-iOS
          path: |
            *.ipa
            *-ios-simulator.zip
          if-no-files-found: error
